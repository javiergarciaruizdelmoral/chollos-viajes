name: Chollos diarios

on:
  schedule:
    # 03:00 y 04:00 UTC: una de las dos son las 5:00 en Madrid (horario de verano o de invierno)
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:       # botón para lanzarlo a mano desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chollos
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.check.outputs.toca }}
    steps:
      - id: check
        run: |
          # de los dos avisos programados, solo sigue el que corresponde a las 5:00 de Madrid
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "toca=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          desfase=$(TZ=Europe/Madrid date +%z | cut -c2-3)   # 01 en invierno, 02 en verano
          utc_objetivo=$((5 - 10#$desfase))
          if [ "${{ github.event.schedule }}" = "0 $utc_objetivo * * *" ]; then echo "toca=si" >> "$GITHUB_OUTPUT"; else echo "toca=no" >> "$GITHUB_OUTPUT"; fi

  buscar:
    needs: hora
    if: needs.hora.outputs.toca == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Ejecutar agentes
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -u main.py

      - name: Guardar historial de precios
        run: |
          git config user.name "chollos-bot"
          git config user.email "chollos-bot@users.noreply.github.com"
          git add data web/datos.js
          git diff --cached --quiet || git commit -m "Chollos $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # Publica la web en GitHub Pages. Se activa creando la variable de repositorio WEB_ACTIVA = true
  web:
    needs: buscar
    if: vars.WEB_ACTIVA == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
